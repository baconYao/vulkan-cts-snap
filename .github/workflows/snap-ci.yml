name: Snap CI

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.base }} (${{ matrix.arch }}) snap
    strategy:
      fail-fast: false
      matrix:
        # base:    the project directory to build (each is a self-contained
        #          snapcraft project rooted at <dir>/snap/snapcraft.yaml)
        # arch:    matches the label used to select the self-hosted runner
        # release: Snap Store channel to publish to. Each base is its own
        #          separate Snap Store package name (baconyao-vulkan-cts-22/
        #          -24/-26, set via the name: field in each snapcraft.yaml)
        #          rather than a track of one shared package, so every base
        #          publishes to its own "edge" channel.
        include:
          - base: core22
            arch: x64
            release: edge
          - base: core22
            arch: arm64
            release: edge
          - base: core24
            arch: x64
            release: edge
          - base: core24
            arch: arm64
            release: edge
          - base: core26
            arch: x64
            release: edge
          - base: core26
            arch: arm64
            release: edge
    runs-on: [self-hosted, linux, "${{ matrix.arch }}", large]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1
        with:
          path: ${{ matrix.base }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-cts-snap-${{ matrix.base }}-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}

  publish:
    name: Publish ${{ matrix.base }} to edge (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: core22
            arch: x64
            release: edge
          - base: core22
            arch: arm64
            release: edge
          - base: core24
            arch: x64
            release: edge
          - base: core24
            arch: arm64
            release: edge
          - base: core26
            arch: x64
            release: edge
          - base: core26
            arch: arm64
            release: edge
    runs-on: [self-hosted, linux, "${{ matrix.arch }}", large]
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: vulkan-cts-snap-${{ matrix.base }}-${{ matrix.arch }}
          path: .

      - name: Resolve snap file
        id: snap
        run: |
          set -euo pipefail
          snap_path="$(find . -maxdepth 2 -type f -name '*.snap' | head -n 1)"
          if [ -z "$snap_path" ]; then
            echo "No .snap artifact found"
            exit 1
          fi
          echo "path=$snap_path" >> "$GITHUB_OUTPUT"

      - name: Publish to Snap Store edge
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.path }}
          release: ${{ matrix.release }}
